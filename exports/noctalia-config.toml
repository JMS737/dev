[plugins]
enabled = []

[shell]
polkit_agent = true

    [shell.screenshot]
    directory = "/home/jeremy/Pictures"

[theme]
builtin = "Rosé Pine"
community_palette = "Oxocarbon"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/jeremy/Pictures/Wallpapers/main"
transition = [ "honeycomb" ]

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/jeremy/Pictures/Wallpapers/main/abstract/solid_abstract_colors-HD.jpg"

    [wallpaper.last]
    path = "/home/jeremy/Pictures/Wallpapers/main/abstract/solid_abstract_colors-HD.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/jeremy/Pictures/Wallpapers/main/abstract/solid_abstract_colors-HD.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/jeremy/Pictures/Wallpapers/main/nature - stylised/Tower-Night.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/jeremy/Pictures/Wallpapers/main/abstract/solid_abstract_colors-HD.jpg"

[widget.clock]
anchor = true

[widget.date]
format = "{:%a %d}"

[widget.network]
show_label = false

[widget.session]
enabled = false

[widget.spacer_2]
