[bar.default]
center = [ "date", "spacer_2", "clock", "spacer_3", "weather" ]
end = [ "tray", "network", "bluetooth", "volume", "brightness", "battery", "notifications", "control-center", "session" ]
margin_ends = 0
radius_top_left = 0
radius_top_right = 0
start = [ "launcher", "group:g1", "workspaces", "media" ]

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_container"
    id = "g1"
    members = [ "caffeine", "clipboard", "wallpaper" ]
    opacity = 1.0
    padding = 6.0

[calendar]
enabled = true

    [calendar.account.home_nextcloud]
    name = "Nextcloud"
    provider = "custom"
    server_url = "https://cloud.home.jsapsed.co.uk/remote.php/dav"
    type = "caldav"
    username = "Jeremy"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[location]
address = "Colchester"

